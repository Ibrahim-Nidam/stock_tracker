<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock &amp; Parts Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --surface:#ffffff; --ink:#0a0a0a; --muted:#6b6b6b;
    --line:#111111; --line-soft:#e4e4e4; --hover:#f5f5f5;
    --bar-bg:#0a0a0a; --bar-ink:#ffffff; --bar-muted:#9a9a9a;
    --yellow:#f2b705; --orange:#e2570c; --on-orange:#ffffff;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0a0a0a; --surface:#131313; --ink:#f2f2f2; --muted:#a3a3a3;
    --line:#f2f2f2; --line-soft:#2a2a2a; --hover:#1c1c1c; --bar-bg:#000; --bar-ink:#fff; --bar-muted:#9a9a9a;
  }}
  :root[data-theme="dark"]{
    --bg:#0a0a0a; --surface:#131313; --ink:#f2f2f2; --muted:#a3a3a3;
    --line:#f2f2f2; --line-soft:#2a2a2a; --hover:#1c1c1c; --bar-bg:#000; --bar-ink:#fff; --bar-muted:#9a9a9a;
  }
  html,body{height:100%;margin:0}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--bg); color:var(--ink)}
  code,.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}

  .navbar{background:var(--bar-bg); color:var(--bar-ink); display:flex; align-items:center; gap:22px; padding:0 20px; padding-top:env(safe-area-inset-top,0px); position:sticky; top:0; z-index:10; overflow-x:auto}
  .brand{display:flex; align-items:baseline; gap:7px; padding:14px 0; flex-shrink:0}
  .brand-mark{font-size:14.5px; font-weight:600; white-space:nowrap}
  .brand-sub{font-size:11px; color:var(--bar-muted); white-space:nowrap}
  nav{display:flex; flex-shrink:0}
  .nav-btn{all:unset; cursor:pointer; font-size:13px; color:#c9c9c9; white-space:nowrap; padding:16px 14px 13px; border-bottom:3px solid transparent}
  .nav-btn:hover{color:#fff}
  .nav-btn.active{color:#fff; border-bottom-color:var(--orange); font-weight:500}
  .bar-spacer{flex:1}
  .theme-btn{all:unset; cursor:pointer; font-size:12px; color:var(--bar-muted); flex-shrink:0; padding:6px 0}
  .theme-btn:hover{color:#fff}

  header.pagehead{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:22px 28px; border-bottom:1px solid var(--line-soft); flex-wrap:wrap}
  h1.page-title{font-size:20px; font-weight:600; margin:0}
  .page-sub{font-size:12.5px; color:var(--muted); margin-top:3px}
  .actions{display:flex; gap:10px; flex-shrink:0}
  .btn{all:unset; cursor:pointer; font-size:13px; font-weight:600; padding:9px 16px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
  .btn-primary{background:var(--orange); color:var(--on-orange)}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-ghost{border:1px solid var(--line); color:var(--ink)}
  .btn-ghost:hover{background:var(--hover)}

  .content{max-width:1100px; margin:0 auto; padding:26px 28px 70px}
  .view{display:none}
  .view.active{display:block}

  .stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:28px}
  .stat-card{border:1px solid var(--line-soft); padding:16px 16px 14px}
  .stat-num{font-size:26px; font-weight:700; font-family:'IBM Plex Mono',monospace}
  .stat-label{font-size:12px; color:var(--muted); margin-top:4px}
  .stat-card.accent-orange{border-bottom:3px solid var(--orange)}
  .stat-card.accent-yellow{border-bottom:3px solid var(--yellow)}
  h2.section-title{font-size:13.5px; font-weight:600; margin:0 0 12px}
  .section-actions{display:flex; justify-content:flex-end; margin-bottom:14px}

  table{width:100%; border-collapse:collapse; font-size:13px}
  th{text-align:left; font-size:11.5px; font-weight:600; color:var(--muted); padding:9px 10px; border-bottom:1px solid var(--line)}
  td{padding:12px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
  tr:hover td{background:var(--hover)}
  .badge{display:inline-block; font-size:11px; font-weight:600; padding:3px 8px; border:1px solid var(--line)}
  .badge-serialised{border-color:var(--orange); color:var(--orange)}
  .badge-nonserialised{border-color:var(--line); color:var(--ink)}
  .badge-consumable{border-color:var(--muted); color:var(--muted)}

  .storage-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px}
  .storage-card{border:1px solid var(--line-soft); padding:16px}
  .storage-name{font-weight:600; font-size:14.5px}
  .storage-count{font-size:12px; color:var(--muted); margin-top:4px}
  .storage-card.dashed{border-style:dashed; display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer; font-size:13px}
  .storage-card.dashed:hover{color:var(--orange); border-color:var(--orange)}

  .list-item{border:1px solid var(--line-soft); border-left-width:4px; border-left-color:var(--orange); padding:13px 16px; display:flex; align-items:center; gap:16px; margin-bottom:10px; font-size:13px; flex-wrap:wrap}
  .li-part{font-family:'IBM Plex Mono',monospace; font-weight:600; min-width:78px}
  .li-name{color:var(--muted); min-width:130px}
  .li-status{margin-left:auto; font-size:11.5px; font-weight:600; padding:3px 9px; border:1px solid var(--orange); color:var(--orange)}

  .history-item{display:flex; gap:16px; padding:11px 0; border-bottom:1px solid var(--line-soft); font-size:13px; flex-wrap:wrap}
  .history-time{font-family:'IBM Plex Mono',monospace; color:var(--muted); min-width:118px; font-size:12px}
  .hint{font-size:12.5px; color:var(--muted)}

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:50; padding:20px}
  .modal-overlay.open{display:flex}
  .modal-box{background:var(--bg); border:1px solid var(--line); max-width:420px; width:100%; padding:20px; max-height:90vh; overflow:auto}
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; font-weight:600; font-size:15px}
  .modal-close{all:unset; cursor:pointer; font-size:20px; line-height:1; color:var(--muted)}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px}
  .field input,.field select{width:100%; padding:8px 10px; border:1px solid var(--line); font-size:13px; background:var(--surface); color:var(--ink); font-family:inherit}
  .radio-row{display:flex; gap:14px; flex-wrap:wrap}
  .radio-row label{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink)}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:4px}

  ::-webkit-scrollbar{height:6px; width:6px}
  ::-webkit-scrollbar-thumb{background:var(--line-soft)}

  @media (max-width:640px){
    header.pagehead{padding:16px}
    .content{padding:18px 16px 50px}
    .actions .btn-ghost{display:none}
  }
</style>
</head>
<body>
  <div class="navbar">
    <div class="brand"><span class="brand-mark">📦 STOCKTRACK</span><span class="brand-sub">Parts &amp; RMA</span></div>
    <nav id="nav">
      <button class="nav-btn active" data-view="dashboard">Dashboard</button>
      <button class="nav-btn" data-view="parts">Parts</button>
      <button class="nav-btn" data-view="stock">Stock</button>
      <button class="nav-btn" data-view="storage">Storage</button>
      <button class="nav-btn" data-view="incoming">Incoming</button>
      <button class="nav-btn" data-view="rma">RMA</button>
      <button class="nav-btn" data-view="history">History</button>
    </nav>
    <div class="bar-spacer"></div>
    <button class="theme-btn" id="themeToggle">Toggle theme</button>
  </div>

  <header class="pagehead">
    <div><h1 class="page-title" id="pageTitle">Dashboard</h1><div class="page-sub" id="pageSub">Overview of parts, stock and open items</div></div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="exportCSV()">Export backup</button>
      <button class="btn btn-primary" onclick="openModal('part')">+ New part</button>
    </div>
  </header>

  <div class="content">
    <section class="view active" id="view-dashboard">
      <div class="stat-row">
        <div class="stat-card"><div class="stat-num" id="statParts">0</div><div class="stat-label">Parts defined</div></div>
        <div class="stat-card"><div class="stat-num" id="statStock">0</div><div class="stat-label">Units in stock</div></div>
        <div class="stat-card accent-orange"><div class="stat-num" id="statWaiting">0</div><div class="stat-label">Waiting arrival</div></div>
        <div class="stat-card accent-yellow"><div class="stat-num" id="statRma">0</div><div class="stat-label">Open RMAs</div></div>
      </div>
      <h2 class="section-title">Recent activity</h2>
      <div id="dashHistory"></div>
    </section>

    <section class="view" id="view-parts">
      <table><thead><tr><th>Part number</th><th>Name</th><th>Type</th><th>Total stock</th><th></th></tr></thead><tbody id="partsBody"></tbody></table>
    </section>

    <section class="view" id="view-stock">
      <table><thead><tr id="stockHead"></tr></thead><tbody id="stockBody"></tbody></table>
    </section>

    <section class="view" id="view-storage">
      <div class="storage-grid" id="storageGrid"></div>
    </section>

    <section class="view" id="view-incoming">
      <div class="section-actions"><button class="btn btn-primary" onclick="openModal('receive')">+ Receive part</button></div>
      <div id="incomingList"></div>
    </section>

    <section class="view" id="view-rma">
      <div class="section-actions"><button class="btn btn-primary" onclick="openModal('rma')">+ New RMA</button></div>
      <table><thead><tr><th>Order / ticket</th><th>Part</th><th>Affected S/N</th><th>New S/N</th><th>Status</th></tr></thead><tbody id="rmaBody"></tbody></table>
    </section>

    <section class="view" id="view-history">
      <div id="historyList"></div>
    </section>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-head"><span id="modalTitle"></span><button class="modal-close" onclick="closeModal()">&times;</button></div>
      <form id="modalForm">
        <div id="modalBody"></div>
        <div class="modal-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
      </form>
    </div>
  </div>

<script>
const DB_NAME='stocktracker', DB_VER=1;
let db, currentModalType=null;

function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      d.createObjectStore('parts',{keyPath:'pn'});
      d.createObjectStore('storages',{keyPath:'name'});
      d.createObjectStore('stock',{keyPath:['pn','storage']});
      d.createObjectStore('serials',{keyPath:'sn'});
      d.createObjectStore('incoming',{keyPath:'id',autoIncrement:true});
      d.createObjectStore('rma',{keyPath:'id',autoIncrement:true});
      d.createObjectStore('history',{keyPath:'id',autoIncrement:true});
    };
    r.onsuccess=e=>res(e.target.result);
    r.onerror=e=>rej(e.target.error);
  });
}
function tx(store,mode='readonly'){ return db.transaction(store,mode).objectStore(store); }
function reqp(req){ return new Promise((res,rej)=>{ req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); }); }
function getAll(store){ return reqp(tx(store).getAll()); }
function getOne(store,key){ return reqp(tx(store).get(key)); }
function put(store,val){ return reqp(tx(store,'readwrite').put(val)); }
function addRec(store,val){ return reqp(tx(store,'readwrite').add(val)); }
function addHistory(pn,desc){ return addRec('history',{pn,desc,date:now()}); }
function now(){ const d=new Date(); return d.toLocaleDateString('en-GB')+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function labelType(t){ return {serialised:'Serialised',nonserialised:'Non-serialised',consumable:'Consumable'}[t]; }
function emptyRow(colspan,text){ return '<tr><td colspan="'+colspan+'" class="hint" style="padding:16px 10px">'+text+'</td></tr>'; }

async function seedIfEmpty(){
  if((await getAll('parts')).length) return;
  const partsSeed=[{pn:'ABC-123',name:'Control Board',type:'serialised'},{pn:'PSU-220',name:'Power Supply Unit',type:'serialised'},{pn:'DEF-555',name:'Fuse 5A',type:'nonserialised'},{pn:'CBL-09',name:'Ribbon Cable',type:'nonserialised'},{pn:'TAPE-001',name:'Electrical Tape',type:'consumable'}];
  for(const p of partsSeed) await put('parts',p);
  for(const s of ['Warehouse','Personal Stock','Car','Office']) await put('storages',{name:s});
  const stockSeed=[{pn:'DEF-555',storage:'Warehouse',qty:30},{pn:'DEF-555',storage:'Personal Stock',qty:8},{pn:'DEF-555',storage:'Car',qty:4},{pn:'CBL-09',storage:'Warehouse',qty:12},{pn:'CBL-09',storage:'Personal Stock',qty:4},{pn:'CBL-09',storage:'Car',qty:2},{pn:'TAPE-001',storage:'Warehouse',qty:20},{pn:'TAPE-001',storage:'Personal Stock',qty:5}];
  for(const s of stockSeed) await put('stock',s);
  const serialSeed=[{sn:'SN002',pn:'ABC-123',storage:'Personal Stock',status:'in_stock'},{sn:'SN003',pn:'ABC-123',storage:'Car',status:'in_stock'},{sn:'OLD-001',pn:'ABC-123',storage:'Warehouse',status:'rma'},{sn:'NEW-001',pn:'ABC-123',storage:'Warehouse',status:'in_stock'},{sn:'SN010',pn:'PSU-220',storage:'Warehouse',status:'in_stock'}];
  for(const s of serialSeed) await put('serials',s);
  await addRec('incoming',{pn:'PSU-220',order:'45002210',storage:'Warehouse',status:'Waiting',qty:null,sn:'SN-NEW-9',date:'26/09/2026 09:00'});
  await addRec('incoming',{pn:'DEF-555',order:'45009981',storage:'Warehouse',status:'Waiting',qty:20,sn:null,date:'26/09/2026 09:05'});
  await addRec('rma',{pn:'ABC-123',order:'45001234',old:'OLD-001',new:'NEW-001',status:'Replaced',date:'27/09/2026 14:15'});
  const hist=[
    {pn:'ABC-123',desc:'Added to Warehouse — qty 10',date:'27/09/2026 10:20'},
    {pn:'ABC-123',desc:'Moved Warehouse to Personal Stock — qty 2',date:'27/09/2026 11:35'},
    {pn:'ABC-123',desc:'Used — serial SN001',date:'27/09/2026 14:10'},
    {pn:'ABC-123',desc:'SN OLD-001 marked RMA, replaced by NEW-001',date:'27/09/2026 14:15'},
    {pn:'DEF-555',desc:'Incoming created, waiting arrival — order 45009981',date:'26/09/2026 09:05'}
  ];
  for(const h of hist) await addRec('history',h);
}

function partStockTotal(pn,part,stock,serials){
  if(part.type==='serialised') return serials.filter(s=>s.pn===pn&&s.status==='in_stock').length;
  return stock.filter(s=>s.pn===pn).reduce((a,s)=>a+s.qty,0);
}

async function renderAll(){
  await Promise.all([renderDashboard(),renderParts(),renderStock(),renderStorage(),renderIncoming(),renderRMA(),renderHistory()]);
}
function renderHistoryList(target,items){
  target.innerHTML = items.map(h=>'<div class="history-item"><span class="history-time">'+h.date+'</span><span class="mono" style="min-width:78px;font-weight:600">'+h.pn+'</span><span>'+h.desc+'</span></div>').join('') || '<p class="hint">No activity yet.</p>';
}
async function renderDashboard(){
  const [parts,stock,serials,incoming,rma,history]=await Promise.all([getAll('parts'),getAll('stock'),getAll('serials'),getAll('incoming'),getAll('rma'),getAll('history')]);
  document.getElementById('statParts').textContent=parts.length;
  document.getElementById('statStock').textContent=stock.reduce((a,s)=>a+s.qty,0)+serials.filter(s=>s.status==='in_stock').length;
  document.getElementById('statWaiting').textContent=incoming.filter(i=>i.status==='Waiting').length;
  document.getElementById('statRma').textContent=rma.length;
  renderHistoryList(document.getElementById('dashHistory'), history.slice(-4).reverse());
}
async function renderParts(){
  const [parts,stock,serials]=await Promise.all([getAll('parts'),getAll('stock'),getAll('serials')]);
  document.getElementById('partsBody').innerHTML = parts.map(p=>{
    const total=partStockTotal(p.pn,p,stock,serials);
    return '<tr><td class="mono">'+p.pn+'</td><td>'+p.name+'</td><td><span class="badge badge-'+p.type+'">'+labelType(p.type)+'</span></td><td class="mono">'+total+'</td><td><button class="btn btn-ghost" style="padding:5px 10px;font-size:12px" onclick="openModal(\'use\',{pn:\''+p.pn+'\'})">Use</button></td></tr>';
  }).join('') || emptyRow(5,'No parts yet — add one to get started.');
}
async function renderStock(){
  const [parts,storages,stock,serials]=await Promise.all([getAll('parts'),getAll('storages'),getAll('stock'),getAll('serials')]);
  document.getElementById('stockHead').innerHTML = '<th>Part number</th>'+storages.map(s=>'<th>'+s.name+'</th>').join('')+'<th>Total</th>';
  document.getElementById('stockBody').innerHTML = parts.map(p=>{
    const cells = storages.map(s=>{
      let v;
      if(p.type==='serialised') v=serials.filter(x=>x.pn===p.pn&&x.storage===s.name&&x.status==='in_stock').length;
      else { const rec=stock.find(x=>x.pn===p.pn&&x.storage===s.name); v=rec?rec.qty:0; }
      return '<td class="mono">'+v+'</td>';
    }).join('');
    return '<tr><td class="mono">'+p.pn+'</td>'+cells+'<td class="mono" style="font-weight:600">'+partStockTotal(p.pn,p,stock,serials)+'</td></tr>';
  }).join('') || emptyRow(storages.length+2,'No parts yet.');
}
async function renderStorage(){
  const [storages,stock,serials]=await Promise.all([getAll('storages'),getAll('stock'),getAll('serials')]);
  document.getElementById('storageGrid').innerHTML = storages.map(s=>{
    const distinct=new Set([...stock.filter(x=>x.storage===s.name&&x.qty>0).map(x=>x.pn), ...serials.filter(x=>x.storage===s.name&&x.status==='in_stock').map(x=>x.pn)]);
    return '<div class="storage-card"><div class="storage-name">'+s.name+'</div><div class="storage-count">'+distinct.size+' different parts</div></div>';
  }).join('') + '<div class="storage-card dashed" onclick="openModal(\'storage\')">+ Create storage</div>';
}
async function renderIncoming(){
  const incoming=(await getAll('incoming')).filter(i=>i.status==='Waiting');
  document.getElementById('incomingList').innerHTML = incoming.map(i=>
    '<div class="list-item"><span class="li-part">'+i.pn+'</span><span class="li-name">Order '+i.order+'</span><span>'+(i.sn?('SN '+i.sn):('Qty '+i.qty))+' &rarr; '+i.storage+'</span><span class="li-status">Waiting arrival</span><button class="btn btn-ghost" style="padding:5px 10px;font-size:12px" onclick="markArrived('+i.id+')">Mark arrived</button></div>'
  ).join('') || '<p class="hint">Nothing waiting on arrival.</p>';
}
async function renderRMA(){
  const rma=(await getAll('rma')).reverse();
  document.getElementById('rmaBody').innerHTML = rma.map(r=>'<tr><td class="mono">'+r.order+'</td><td class="mono">'+r.pn+'</td><td class="mono">'+r.old+'</td><td class="mono">'+r.new+'</td><td>'+r.status+'</td></tr>').join('') || emptyRow(5,'No RMAs yet.');
}
async function renderHistory(){
  renderHistoryList(document.getElementById('historyList'), (await getAll('history')).reverse());
}

async function markArrived(id){
  const rec=await getOne('incoming',id);
  rec.status='Arrived';
  await put('incoming',rec);
  await commitReceive(rec);
  await addHistory(rec.pn,'Marked arrived — order '+rec.order);
  await renderAll();
}
async function commitReceive(rec){
  if(rec.sn){ await put('serials',{sn:rec.sn,pn:rec.pn,storage:rec.storage,status:'in_stock'}); }
  else { const s=await getOne('stock',[rec.pn,rec.storage]); await put('stock',{pn:rec.pn,storage:rec.storage,qty:(s?s.qty:0)+rec.qty}); }
}

async function onReceivePartChange(){
  const sel=document.getElementById('f_pn');
  const t=sel.selectedOptions[0] ? sel.selectedOptions[0].dataset.type : 'nonserialised';
  document.getElementById('f_qtyWrap').style.display = t==='serialised' ? 'none':'block';
  document.getElementById('f_snWrap').style.display = t==='serialised' ? 'block':'none';
}
async function onUsePartChange(){
  const sel=document.getElementById('f_pn');
  const t=sel.selectedOptions[0] ? sel.selectedOptions[0].dataset.type : 'nonserialised';
  document.getElementById('f_storageWrap').style.display = t==='serialised' ? 'none':'block';
  document.getElementById('f_qtyWrap').style.display = t==='serialised' ? 'none':'block';
  document.getElementById('f_snWrap').style.display = t==='serialised' ? 'block':'none';
  if(t==='serialised'){
    const serials=(await getAll('serials')).filter(s=>s.pn===sel.value&&s.status==='in_stock');
    document.getElementById('f_sn').innerHTML = serials.map(s=>'<option value="'+s.sn+'">'+s.sn+' — '+s.storage+'</option>').join('') || '<option value="">No units in stock</option>';
  }
}

async function openModal(type,prefill={}){
  currentModalType=type;
  const titles={part:'New part',storage:'New storage',receive:'Receive part',use:'Use part',rma:'New RMA'};
  document.getElementById('modalTitle').textContent=titles[type];
  const body=document.getElementById('modalBody');
  if(type==='part'){
    body.innerHTML='<div class="field"><label>Type</label><div class="radio-row"><label><input type="radio" name="ptype" value="consumable"> Consumable</label><label><input type="radio" name="ptype" value="nonserialised" checked> Non-serialised</label><label><input type="radio" name="ptype" value="serialised"> Serialised</label></div></div><div class="field"><label>Part number</label><input id="f_pn" required></div><div class="field"><label>Name</label><input id="f_name" required></div>';
  } else if(type==='storage'){
    body.innerHTML='<div class="field"><label>Storage name</label><input id="f_name" required></div>';
  } else if(type==='receive'){
    const [parts,storages]=await Promise.all([getAll('parts'),getAll('storages')]);
    body.innerHTML='<div class="field"><label>Part</label><select id="f_pn" onchange="onReceivePartChange()">'+parts.map(p=>'<option value="'+p.pn+'" data-type="'+p.type+'">'+p.pn+' — '+p.name+'</option>').join('')+'</select></div><div class="field"><label>Order / ticket</label><input id="f_order" required></div><div class="field"><label>Storage</label><select id="f_storage">'+storages.map(s=>'<option>'+s.name+'</option>').join('')+'</select></div><div class="field" id="f_qtyWrap"><label>Quantity</label><input id="f_qty" type="number" min="1" value="1"></div><div class="field" id="f_snWrap" style="display:none"><label>Serial number</label><input id="f_sn"></div><div class="field"><label>Status</label><select id="f_status"><option value="Waiting">Waiting arrival</option><option value="Arrived">Arrived</option></select></div>';
    await onReceivePartChange();
  } else if(type==='use'){
    const [parts,storages]=await Promise.all([getAll('parts'),getAll('storages')]);
    body.innerHTML='<div class="field"><label>Part</label><select id="f_pn" onchange="onUsePartChange()">'+parts.map(p=>'<option value="'+p.pn+'" data-type="'+p.type+'">'+p.pn+' — '+p.name+'</option>').join('')+'</select></div><div class="field" id="f_storageWrap"><label>Storage</label><select id="f_storage">'+storages.map(s=>'<option>'+s.name+'</option>').join('')+'</select></div><div class="field" id="f_qtyWrap"><label>Quantity</label><input id="f_qty" type="number" min="1" value="1"></div><div class="field" id="f_snWrap" style="display:none"><label>Serial number</label><select id="f_sn"></select></div>';
    if(prefill.pn) document.getElementById('f_pn').value=prefill.pn;
    await onUsePartChange();
  } else if(type==='rma'){
    const parts=(await getAll('parts')).filter(p=>p.type==='serialised');
    body.innerHTML='<div class="field"><label>Part</label><select id="f_pn">'+parts.map(p=>'<option value="'+p.pn+'">'+p.pn+' — '+p.name+'</option>').join('')+'</select></div><div class="field"><label>Affected serial number</label><input id="f_old" required></div><div class="field"><label>Replacement serial number</label><input id="f_new" required></div><div class="field"><label>Order / ticket</label><input id="f_order" required></div>';
  }
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('modalForm').reset();
}

document.getElementById('modalForm').addEventListener('submit', async e=>{
  e.preventDefault();
  try{
    if(currentModalType==='part') await savePart();
    else if(currentModalType==='storage') await saveStorage();
    else if(currentModalType==='receive') await saveReceive();
    else if(currentModalType==='use') await saveUse();
    else if(currentModalType==='rma') await saveRMA();
    closeModal();
    await renderAll();
  }catch(err){ alert(err.message); }
});

async function savePart(){
  const type=document.querySelector('input[name=ptype]:checked').value;
  const pn=document.getElementById('f_pn').value.trim();
  const name=document.getElementById('f_name').value.trim();
  if(!pn||!name) throw new Error('Part number and name are required.');
  if(await getOne('parts',pn)) throw new Error('A part with this number already exists.');
  await put('parts',{pn,name,type});
  await addHistory(pn,'Part created ('+labelType(type)+')');
}
async function saveStorage(){
  const name=document.getElementById('f_name').value.trim();
  if(!name) throw new Error('Storage name is required.');
  if(await getOne('storages',name)) throw new Error('A storage with this name already exists.');
  await put('storages',{name});
  await addHistory('—','Storage "'+name+'" created');
}
async function saveReceive(){
  const pn=document.getElementById('f_pn').value;
  const order=document.getElementById('f_order').value.trim();
  const storage=document.getElementById('f_storage').value;
  const status=document.getElementById('f_status').value;
  const part=await getOne('parts',pn);
  let qty=null, sn=null;
  if(part.type==='serialised'){ sn=document.getElementById('f_sn').value.trim(); if(!sn) throw new Error('Serial number is required.'); }
  else { qty=parseInt(document.getElementById('f_qty').value,10); if(!qty||qty<1) throw new Error('Enter a valid quantity.'); }
  const rec={pn,order,storage,status,qty,sn,date:now()};
  await addRec('incoming',rec);
  if(status==='Arrived') await commitReceive(rec);
  await addHistory(pn,(status==='Arrived'?'Received & arrived':'Incoming created, waiting arrival')+' — order '+order);
}
async function saveUse(){
  const pn=document.getElementById('f_pn').value;
  const part=await getOne('parts',pn);
  if(part.type==='serialised'){
    const sn=document.getElementById('f_sn').value;
    if(!sn) throw new Error('Choose a serial number.');
    const serial=await getOne('serials',sn);
    serial.status='used';
    await put('serials',serial);
    await addHistory(pn,'Used — serial '+sn+' ('+serial.storage+')');
  } else {
    const storage=document.getElementById('f_storage').value;
    const qty=parseInt(document.getElementById('f_qty').value,10);
    const s=await getOne('stock',[pn,storage]);
    const avail=s?s.qty:0;
    if(!qty||qty<1||qty>avail) throw new Error('Not enough stock at '+storage+' (available: '+avail+').');
    await put('stock',{pn,storage,qty:avail-qty});
    await addHistory(pn,'Used '+qty+' from '+storage);
  }
}
async function saveRMA(){
  const pn=document.getElementById('f_pn').value;
  const old=document.getElementById('f_old').value.trim();
  const nw=document.getElementById('f_new').value.trim();
  const order=document.getElementById('f_order').value.trim();
  if(!old||!nw||!order) throw new Error('All RMA fields are required.');
  if((await getAll('rma')).some(r=>r.old===old)) throw new Error('This serial number has already been used.');
  const oldSerial=await getOne('serials',old);
  const storage=oldSerial?oldSerial.storage:'Warehouse';
  if(oldSerial){ oldSerial.status='rma'; await put('serials',oldSerial); }
  await put('serials',{sn:nw,pn,storage,status:'in_stock'});
  await addRec('rma',{pn,order,old,new:nw,status:'Replaced',date:now()});
  await addHistory(pn,'SN '+old+' marked RMA, replaced by '+nw);
}

function csvEscape(v){ v=(v===null||v===undefined?'':v).toString(); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
async function exportCSV(){
  const [parts,storages,stock,serials,incoming,rma,history]=await Promise.all([getAll('parts'),getAll('storages'),getAll('stock'),getAll('serials'),getAll('incoming'),getAll('rma'),getAll('history')]);
  const cols=['record_type','pn','name','type','storage','qty','sn','status','order','old','new','date','desc'];
  const rows=[cols.join(',')];
  const push=o=>rows.push(cols.map(c=>csvEscape(o[c])).join(','));
  parts.forEach(p=>push({record_type:'PART',pn:p.pn,name:p.name,type:p.type}));
  storages.forEach(s=>push({record_type:'STORAGE',name:s.name}));
  stock.forEach(s=>push({record_type:'STOCK',pn:s.pn,storage:s.storage,qty:s.qty}));
  serials.forEach(s=>push({record_type:'SERIAL',pn:s.pn,storage:s.storage,sn:s.sn,status:s.status}));
  incoming.forEach(i=>push({record_type:'INCOMING',pn:i.pn,storage:i.storage,order:i.order,qty:i.qty,sn:i.sn,status:i.status,date:i.date}));
  rma.forEach(r=>push({record_type:'RMA',pn:r.pn,order:r.order,old:r.old,new:r.new,status:r.status,date:r.date}));
  history.forEach(h=>push({record_type:'HISTORY',pn:h.pn,date:h.date,desc:h.desc}));
  const blob=new Blob([rows.join('\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='stock-backup.csv'; document.body.appendChild(a); a.click(); a.remove();
}

const titles={
  dashboard:['Dashboard','Overview of parts, stock and open items'],
  parts:['Parts','Catalog of every part definition'],
  stock:['Stock','Quantities by storage location'],
  storage:['Storage','Locations where parts are physically held'],
  incoming:['Incoming','Parts on order, waiting arrival'],
  rma:['RMA','Serialised replacements and affected units'],
  history:['History','Complete audit trail of stock operations']
};
document.getElementById('nav').addEventListener('click', e=>{
  const btn=e.target.closest('.nav-btn');
  if(!btn) return;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const view=btn.dataset.view;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  document.getElementById('pageTitle').textContent=titles[view][0];
  document.getElementById('pageSub').textContent=titles[view][1];
});
document.getElementById('themeToggle').addEventListener('click', ()=>{
  const r=document.documentElement;
  r.setAttribute('data-theme', r.getAttribute('data-theme')==='dark' ? 'light' : 'dark');
});
document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });

(async()=>{
  db=await openDB();
  await seedIfEmpty();
  await renderAll();
})();
